<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Measurements</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#4b8eff",
                        "primary-fixed-dim": "#abd600",
                        "error-container": "#93000a",
                        "surface-container": "#201f1f",
                        "on-primary-fixed-variant": "#3c4d00",
                        "on-background": "#e5e2e1",
                        "surface-bright": "#3a3939",
                        "on-tertiary": "#313030",
                        "surface-container-low": "#1c1b1b",
                        "outline": "#8e9379",
                        "on-tertiary-container": "#656464",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "on-secondary-container": "#00285c",
                        "on-surface-variant": "#c4c9ac",
                        "surface-dim": "#131313",
                        "on-error": "#690005",
                        "on-secondary-fixed": "#001a41",
                        "surface-variant": "#353534",
                        "on-secondary-fixed-variant": "#004493",
                        "secondary-fixed-dim": "#adc6ff",
                        "inverse-primary": "#506600",
                        "on-secondary": "#002e69",
                        "inverse-on-surface": "#313030",
                        "surface-container-highest": "#353534",
                        "surface-tint": "#abd600",
                        "inverse-surface": "#e5e2e1",
                        "primary-container": "#c3f400",
                        "outline-variant": "#444933",
                        "error": "#ffb4ab",
                        "surface-container-lowest": "#0e0e0e",
                        "on-tertiary-fixed": "#1c1b1b",
                        "background": "#131313",
                        "surface": "#131313",
                        "on-surface": "#e5e2e1",
                        "primary-fixed": "#c3f400",
                        "tertiary-fixed": "#e5e2e1",
                        "secondary": "#adc6ff",
                        "on-error-container": "#ffdad6",
                        "primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#474746",
                        "on-primary-container": "#556d00",
                        "secondary-fixed": "#d8e2ff",
                        "tertiary-container": "#e5e2e1",
                        "on-primary": "#283500",
                        "on-primary-fixed": "#161e00",
                        "surface-container-high": "#2a2a2a",
                        "tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "stack-sm": "8px",
                        "margin-page": "20px",
                        "gutter-card": "12px",
                        "stack-lg": "24px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "display-lg": ["Montserrat"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Montserrat"],
                        "headline-lg": ["Montserrat"]
                    },
                    "fontSize": {
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-1px", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Simple Line Chart CSS for visual approximation */
        .chart-line {
            stroke: #abd600; /* primary-fixed-dim */
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 8px rgba(171, 214, 0, 0.4));
        }
        .chart-point {
            fill: #131313;
            stroke: #abd600;
            stroke-width: 2;
        }
        .chart-area {
            fill: url(#chart-gradient);
            opacity: 0.2;
        }
        .chart-grid {
            stroke: #353534; /* surface-variant */
            stroke-width: 1;
            stroke-dasharray: 4 4;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-24 font-body-md">
<!-- TopAppBar -->
<header class="bg-background/60 backdrop-blur-xl fixed top-0 w-full z-50 border-b border-outline-variant/10 flat no shadows flex justify-between items-center px-margin-page h-16 w-full">
<div class="flex items-center gap-stack-sm hover:opacity-80 transition-opacity cursor-pointer">
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant/20 bg-surface-container">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A close-up headshot of a fitness enthusiast with a focused expression. Shot in a premium, dark-mode gym setting with subtle neon green edge lighting to match the app's modern tech-infusion aesthetic. High contrast, sharp focus, professional fitness photography." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCCm6UdtoQLMLddxC-NRBtHeBSYszmjvdxFX7QkEouftvFFxwp88ZoFcAIF1uZgf7NUQPywTTtmVJ3qpyzsD5s0ufWLhOibrVAxQx0YsncPX2T85MQJpk9o8j6H00zH43GU0aftrHrago-sCm2ElTnA6jbmlPEAhvPpvyvtNZMFLrJNWzBiP0OxEUlPTKmoWOQPfBewM3ytXQDegeCwvtFsxs6QOnpUVkCJ-NQLkw0uFKfyNK8S2lXy"/>
</div>
<span class="font-display-lg text-headline-lg-mobile font-bold tracking-tighter text-primary-fixed">FORGE</span>
</div>
<button class="hover:opacity-80 transition-opacity active:scale-95 transition-transform text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-margin-page pb-stack-lg flex flex-col gap-stack-lg max-w-3xl mx-auto">
<!-- Section Header -->
<div class="flex justify-between items-end">
<div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-on-background">Progress Overview</h1>
<p class="font-body-md text-on-surface-variant text-sm mt-1">Tracking your physical evolution.</p>
</div>
<button class="text-primary-fixed-dim font-label-sm uppercase tracking-wider flex items-center gap-1 hover:text-primary-fixed transition-colors">
<span>Filter</span>
<span class="material-symbols-outlined text-sm" data-icon="filter_list">filter_list</span>
</button>
</div>
<!-- Line Chart Card (Weight Progress) -->
<section class="bg-surface-container-low rounded-xl border border-surface-container-highest p-stack-md flex flex-col gap-stack-md relative overflow-hidden group">
<div class="flex justify-between items-start z-10 relative">
<div>
<h2 class="font-headline-lg-mobile text-on-background">Weight</h2>
<div class="flex items-baseline gap-2 mt-1">
<span class="font-display-lg text-display-lg text-primary-fixed-dim">78.5</span>
<span class="font-label-sm text-on-surface-variant uppercase">kg</span>
</div>
</div>
<div class="bg-surface-container px-3 py-1 rounded-full border border-surface-container-highest flex items-center gap-1">
<span class="material-symbols-outlined text-primary-fixed-dim text-sm" data-icon="trending_down">trending_down</span>
<span class="font-label-sm text-primary-fixed-dim">-1.2 kg</span>
</div>
</div>
<!-- SVG Line Chart Mockup -->
<div class="w-full h-48 mt-4 relative z-10">
<svg class="w-full h-full preserve-aspect-ratio-none" viewbox="0 0 400 150">
<defs>
<lineargradient id="chart-gradient" x1="0" x2="0" y1="0" y2="1">
<stop offset="0%" stop-color="#abd600" stop-opacity="0.8"></stop>
<stop offset="100%" stop-color="#abd600" stop-opacity="0"></stop>
</lineargradient>
</defs>
<!-- Grid -->
<line class="chart-grid" x1="0" x2="400" y1="30" y2="30"></line>
<line class="chart-grid" x1="0" x2="400" y1="75" y2="75"></line>
<line class="chart-grid" x1="0" x2="400" y1="120" y2="120"></line>
<!-- Area -->
<path class="chart-area" d="M 0 100 L 80 85 L 160 110 L 240 60 L 320 70 L 400 40 L 400 150 L 0 150 Z"></path>
<!-- Line -->
<path class="chart-line" d="M 0 100 L 80 85 L 160 110 L 240 60 L 320 70 L 400 40"></path>
<!-- Points -->
<circle class="chart-point" cx="80" cy="85" r="4"></circle>
<circle class="chart-point" cx="160" cy="110" r="4"></circle>
<circle class="chart-point" cx="240" cy="60" r="4"></circle>
<circle class="chart-point" cx="320" cy="70" r="4"></circle>
<circle class="chart-point" cx="400" cy="40" r="4"></circle>
</svg>
</div>
<div class="flex justify-between font-label-sm text-on-surface-variant text-xs px-2 z-10 relative">
<span>Jan</span>
<span>Feb</span>
<span>Mar</span>
<span>Apr</span>
<span>May</span>
<span>Jun</span>
</div>
</section>
<!-- Metrics Bento Grid -->
<section class="grid grid-cols-2 gap-gutter-card">
<!-- Body Fat % Card -->
<div class="bg-surface-container-low rounded-xl border border-surface-container-highest p-stack-md flex flex-col justify-between aspect-square hover:border-primary-fixed/20 transition-colors cursor-pointer group">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-fixed-dim transition-colors" data-icon="percent">percent</span>
<span class="font-label-sm text-on-surface-variant bg-surface-container px-2 py-1 rounded-md text-[10px] uppercase">Body Fat</span>
</div>
<div class="mt-auto">
<div class="flex items-baseline gap-1">
<span class="font-headline-lg-mobile md:font-headline-lg text-on-background">14.2</span>
<span class="font-label-sm text-primary-fixed-dim">%</span>
</div>
<div class="w-full bg-surface-container h-1.5 rounded-full mt-3 overflow-hidden">
<div class="bg-primary-fixed-dim h-full rounded-full" style="width: 45%;"></div>
</div>
</div>
</div>
<!-- Shoulder Width Card -->
<div class="bg-surface-container-low rounded-xl border border-surface-container-highest p-stack-md flex flex-col justify-between aspect-square hover:border-primary-fixed/20 transition-colors cursor-pointer group">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-fixed-dim transition-colors" data-icon="straighten">straighten</span>
<span class="font-label-sm text-on-surface-variant bg-surface-container px-2 py-1 rounded-md text-[10px] uppercase">Shoulders</span>
</div>
<div class="mt-auto">
<div class="flex items-baseline gap-1">
<span class="font-headline-lg-mobile md:font-headline-lg text-on-background">122</span>
<span class="font-label-sm text-primary-fixed-dim">cm</span>
</div>
<p class="font-label-sm text-on-surface-variant mt-1 text-xs">+2cm this month</p>
</div>
</div>
<!-- Sleep Card (Extra metric to fill grid) -->
<div class="bg-surface-container-low rounded-xl border border-surface-container-highest p-stack-md flex flex-col justify-between aspect-square hover:border-primary-fixed/20 transition-colors cursor-pointer group col-span-2 sm:col-span-1">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-secondary-fixed-dim transition-colors" data-icon="bedtime">bedtime</span>
<span class="font-label-sm text-on-surface-variant bg-surface-container px-2 py-1 rounded-md text-[10px] uppercase">Avg Sleep</span>
</div>
<div class="mt-auto flex items-end justify-between">
<div>
<div class="flex items-baseline gap-1">
<span class="font-headline-lg-mobile md:font-headline-lg text-on-background">7</span>
<span class="font-label-sm text-secondary-fixed-dim">h</span>
<span class="font-headline-lg-mobile md:font-headline-lg text-on-background ml-1">15</span>
<span class="font-label-sm text-secondary-fixed-dim">m</span>
</div>
</div>
<!-- Mini bar chart representing days -->
<div class="flex items-end gap-1 h-8 opacity-60">
<div class="w-1.5 bg-secondary-fixed-dim rounded-t-sm h-[60%]"></div>
<div class="w-1.5 bg-secondary-fixed-dim rounded-t-sm h-[80%]"></div>
<div class="w-1.5 bg-secondary-fixed-dim rounded-t-sm h-[100%]"></div>
<div class="w-1.5 bg-secondary-fixed-dim rounded-t-sm h-[40%]"></div>
<div class="w-1.5 bg-secondary-fixed-dim rounded-t-sm h-[75%]"></div>
</div>
</div>
</div>
</section>
<!-- Action Button -->
<button class="w-full bg-primary-fixed text-on-primary-fixed font-label-sm uppercase tracking-wide py-4 rounded-xl border border-primary-fixed hover:bg-primary-fixed-dim transition-colors active:scale-[0.98] mt-2 flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span>
            Log New Measurements
        </button>
</main>
<!-- BottomNavBar (Visible on Mobile) -->
<nav class="md:hidden bg-surface-container-lowest/80 backdrop-blur-xl fixed bottom-0 w-full z-50 rounded-t-xl border-t border-outline-variant/20 flat no shadows fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 pb-8">
<!-- Inactive Tab: Diet -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-fixed-dim active:scale-90 transition-all duration-200 gap-1 w-16" href="#">
<span class="material-symbols-outlined" data-icon="restaurant">restaurant</span>
<span class="font-label-sm text-[10px]">Diet</span>
</a>
<!-- Inactive Tab: Workouts -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-fixed-dim active:scale-90 transition-all duration-200 gap-1 w-16" href="#">
<span class="material-symbols-outlined" data-icon="fitness_center">fitness_center</span>
<span class="font-label-sm text-[10px]">Workouts</span>
</a>
<!-- Active Tab: Metrics -->
<a class="flex flex-col items-center justify-center text-primary-fixed bg-primary-fixed/10 rounded-full py-1 px-4 active:scale-90 transition-all duration-200 gap-1" href="#">
<span class="material-symbols-outlined" data-icon="monitoring" data-weight="fill">monitoring</span>
<span class="font-label-sm text-[10px]">Metrics</span>
</a>
</nav>
</body></html>
